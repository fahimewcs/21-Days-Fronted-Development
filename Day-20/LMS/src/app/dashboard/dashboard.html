<!-- Navbar -->
<header class="navbar">
  <div class="navbar-left">
    <button class="sidebar-toggle-btn" (click)="toggleSidebar()">☰</button>
    <img src="lmslogo.png" alt="Logo" class="logo">
    <span class="brand-name">Knowledge House</span>
  </div>

  <div class="navbar-center">
    <input type="text" placeholder="Search books..." [(ngModel)]="searchText">
    <button (click)="onSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>

  <div class="navbar-right">
     <span class="welcome-text" *ngIf="auth.isLoggedIn()">
        Hello, {{ username }}
      </span>

      <button class="cart-btn" [routerLink]="['/cart']">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-text">Cart</span>
        <span class="cart-badge">{{ cart.items().length }}</span>
      </button>

      <button *ngIf="auth.isLoggedIn()"
              (click)="logout()"
              class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
      </button>
  </div>
</header>

<div class="dashboard-body">

  <aside class="sidebar" [class.expanded]="isSidebarExpanded">
  <ul class="sidebar-links">
    <li>
      <a routerLink=" " routerLinkActive="active-link" data-title="Home">
        <i class="fa-solid fa-house icon"></i>
        <span class="text" *ngIf="isSidebarExpanded">Home</span>
      </a>
    </li>

    <li>
      <a routerLink="/dashboard/books" routerLinkActive="active-link" data-title="Books">
        <i class="fa-solid fa-book icon"></i>
        <span class="text" *ngIf="isSidebarExpanded">Books</span>
      </a>
    </li>

    <li>
      <a routerLink="/dashboard/clients" routerLinkActive="active-link" data-title="Clients">
        <i class="fa-solid fa-user icon"></i>
        <span class="text" *ngIf="isSidebarExpanded">Clients</span>
      </a>
    </li>
  </ul>
</aside>

  <!-- Main Content -->
  <main class="main-content" [class.shifted]="isSidebarExpanded">

    <section class="books-section">
      <h2>Available Books</h2>
      <div class="book-grid">
        <div class="book-card" *ngFor="let book of books">
          <div class="book-image-wrapper">
            <img [src]="book.image" alt="Book Cover">
            <!-- <span *ngIf="book.new" class="book-badge">New</span> -->
          </div>

          <div class="book-info">
            <h3>{{ book.title }}</h3>
            <p class="author">by {{ book.author }}</p>
            <p class="price">৳ {{ book.price }}</p>
          </div>

          <div class="book-actions">
            <button class="view-btn" (click)="viewDetails(book)">
              <i class="fa-solid fa-eye"></i>
              View Details
            </button>

            <!-- <button class="add-cart-btn" (click)="addToCart(book)">
              <i class="fa-solid fa-cart-plus"></i>
              Add to Cart
            </button> -->
            <button 
              class="add-cart-btn"
              [class.added]="book.added"
              [disabled]="book.added"
              (click)="addToCart(book)">

              <i class="fa-solid"
                [ngClass]="book.added ? 'fa-check' : 'fa-cart-plus'">
              </i>

              {{ book.added ? 'Added' : 'Add to Cart' }}
            </button>
          </div>
        </div>
      </div>
    </section>



  </main>

</div>

<!-- Footer -->
<footer class="footer">
  <p>© 2026 Knowledge House | All Rights Reserved</p>
</footer>
